server:
  port: 8080
spring:
  application:
    name: bff-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
app:
  security:
    audience: ${ENTRA_API_CLIENT_ID:CHANGE_ME_API_CLIENT_ID}
  services:
    ot: ${OT_SERVICE_URL:http://localhost:8081}
    events: ${EVENT_SERVICE_URL:http://localhost:8082}
    notifications: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
