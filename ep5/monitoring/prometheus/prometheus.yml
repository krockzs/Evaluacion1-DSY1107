global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter:9308
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: kafka_.*
        action: keep
